<header class="mag-cover" id="essayCover"></header>

<footer>
  <p>© 2026 English Hub 英语学习站 · 押题仅供参考，范文请结合课堂要求使用</p>
</footer>

<script src="data-essay2027.js?v=1"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const d = ESSAY2027;
  document.getElementById('essayCover').innerHTML =
    '<h1>✍️ 2027 作文押题特刊</h1><div class="issue">' + d.issue + '</div>' +
    '<p style="color:#64748b;margin-top:10px">' + d.intro + '</p>';
  document.getElementById('essayWrap').innerHTML = d.topics.map((t) => `
    <article class="article">
      <div class="cat">${t.cat}</div>
      <h2>${t.title}</h2>
      <p style="color:#475569;font-size:14px;margin:6px 0">${t.prompt}</p>
      <p style="color:#16a34a;font-size:13px;margin:0 0 12px">${t.exams}</p>
      <p class="body-en" style="white-space:pre-line">${t.en}</p>
      <p class="body-zh" style="white-space:pre-line">${t.zh}</p>
      <div class="wordlist"><b>核心词汇：</b>${t.words.map((w) => ` ${w[0]}（${w[1]}）`).join('；')}</div>
      <div class="wordlist"><b>亮点句型：</b>${t.phrases.map((p) => ` “${p}”`).join('；')}</div>
    </article>`).join('');
});
</script>
</body>
